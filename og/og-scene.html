<!doctype html>
<!-- Source scene for og/iqcr-og.png (1200x627). Render with: node og/render.js
     (serves the repo root, screenshots this page). Same arm, same kinematics as
     the live hero; only the camera, pose and overlay differ. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>IQCR og card</title>
<style>
@font-face{font-family:"Inter"; font-weight:100 900; src:url("../fonts/inter-latin.woff2") format("woff2");}
@font-face{font-family:"JetBrains Mono"; font-weight:100 800; src:url("../fonts/jetbrains-mono-latin.woff2") format("woff2");}
html,body{margin:0; background:#0B0B0C;}
body{width:1200px; height:627px; overflow:hidden; position:relative; color:#fff; font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
#host{position:absolute; inset:0;
  background:
    radial-gradient(55% 75% at 68% 55%, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%),
    radial-gradient(36% 28% at 70% 92%, rgba(198,244,50,0.06) 0%, rgba(198,244,50,0) 100%),
    #0B0B0C;}
canvas{position:absolute; inset:0; width:100%; height:100%;}
.copy{position:absolute; left:64px; bottom:56px; width:560px;}
.kicker{font-family:"JetBrains Mono",monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:#C6F432; font-weight:700; margin:0 0 18px; display:flex; align-items:center; gap:12px;}
.kicker::before{content:""; width:28px; height:2px; background:#C6F432;}
h1{font-size:56px; line-height:1.02; letter-spacing:-0.02em; font-weight:700; margin:0 0 20px;}
.sub{font-family:"JetBrains Mono",monospace; font-size:17px; color:#A3A3A6; margin:0 0 30px; letter-spacing:0.01em;}
.url{font-family:"JetBrains Mono",monospace; font-size:15px; color:#A3A3A6;}
.url b{color:#fff; font-weight:500;}
.tags{position:absolute; right:56px; bottom:56px; display:flex; flex-direction:column; gap:7px; align-items:flex-end;}
.leaders{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible;}
.leaders line{stroke:rgba(255,255,255,0.5); stroke-width:1;}
.leaders circle{fill:#0B0B0C; stroke:#C6F432; stroke-width:1.5;}
.tag{font-family:"JetBrains Mono",monospace; font-size:12.5px; letter-spacing:0.04em; color:#A3A3A6; background:rgba(11,11,12,0.55); border:1px solid #2A2A2D; border-radius:3px; padding:4px 9px; font-variant-numeric:tabular-nums;}
.tag b{color:#fff; font-weight:500; margin-left:10px; white-space:pre;}
.frame{position:absolute; inset:0; border:1px solid rgba(255,255,255,0.06); pointer-events:none;}
</style>
</head>
<body>
<div id="host"><canvas></canvas></div>
<div class="frame"></div>
<svg class="leaders" id="leaders"></svg>
<div class="tags" id="tags"></div>
<div class="copy">
  <p class="kicker">Live simulation</p>
  <h1>Inspection &amp; Quality Control Robots</h1>
  <p class="sub">Six-axis IK, live in the browser &middot; IEEE ICACR 2026</p>
  <p class="url"><b>veer-sanghvi.github.io</b>/IQCR</p>
</div>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.min.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
<script src="../kinematics.js"></script>
<script type="module">
import * as THREE from "three";
import { buildArm, makeStudio, makeEnvironment, jointAnchors } from "../hero.js";
const K = window.IQCR_KIN;
const host = document.getElementById("host");
const renderer = new THREE.WebGLRenderer({ canvas: host.querySelector("canvas"), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2);
renderer.setSize(1200, 627, false);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
makeStudio(renderer, scene);
makeEnvironment(renderer, scene);
const arm = buildArm(K);
scene.add(arm.group);
// pose: base turned toward the lens, shoulder forward, wrist pitched down so the
// sensor and its scan cone reach toward the viewer
const q = [0.08, 0.62, -0.28, 0.2, 1.08, 0.1];
const { frames } = K.fkChain(q);
arm.update(frames);
arm.glow.material.opacity = 0.7;
arm.cone.material.opacity = 0.1;
const camera = new THREE.PerspectiveCamera(25, 1200 / 627, 10, 6000);
camera.up.set(0, 0, 1);
camera.position.set(1120, -1600, 160); // dramatic low three-quarter angle, arm in the right column
camera.lookAt(0, -320, 315);
camera.updateMatrixWorld();
// stronger rim for the still
const rim2 = new THREE.DirectionalLight(0xC6F432, 0.5);
rim2.position.set(-500, 900, 300);
scene.add(rim2);
const tags = document.getElementById("tags");
const leaders = document.getElementById("leaders");
const anchors = jointAnchors(frames);
const screen = anchors.map((a) => { const v = a.clone().project(camera); return [(v.x * 0.5 + 0.5) * 1200, (-v.y * 0.5 + 0.5) * 627]; });
// the tag column fans out from the bottom-right corner, so the leaders stay
// apart when the tags are ordered by their bearing from the column (steepest
// at the top, flattest at the bottom), not by the joints' screen height
const fan = [1200 - 56 - 100, 627 - 56 - 95];
const order = screen.map((p, j) => [Math.atan2(p[1] - fan[1], p[0] - fan[0]), j]).sort((a, b) => b[0] - a[0]).map(([, j]) => j);
order.forEach((i) => {
  const d = (q[i] * 180) / Math.PI;
  const deg = ((d >= 0 ? "+" : "−") + Math.abs(d).toFixed(1)).padStart(6, " ") + "°";
  tags.insertAdjacentHTML("beforeend", `<div class="tag" data-j="${i}">J${i + 1}<b>${deg}</b></div>`);
});
await document.fonts.ready;
for (const tag of tags.children) {
  const i = Number(tag.dataset.j), [x, y] = screen[i], r = tag.getBoundingClientRect();
  leaders.insertAdjacentHTML("beforeend", `<line x1="${r.left - 6}" y1="${r.top + r.height / 2}" x2="${x}" y2="${y}"></line><circle cx="${x}" cy="${y}" r="3.5"></circle>`);
}
renderer.render(scene, camera);
document.body.dataset.ready = "1";
</script>
</body>
</html>
